<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galerie</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="navigation"></div>
  <script src="js/nav.js"></script>

  <main>
    <h1>Galerie</h1>

<div style="text-align: center; margin-bottom: 1em;">
  <label for="collectionFilter">Filtrer par collection :</label>
  <select id="collectionFilter">
    <option value="all">Toutes les collections</option>
  </select>
</div>
    <div class="gallery" id="gallery">Chargement...</div>
  </main>

  <script src="js/nftgallery.js"></script>
  <audio id="bg-audio" loop>
  <source src="audio/pp.wav" type="audio/mpeg" />
</audio>

<script>
  document.querySelector('h1').addEventListener('click', function () {
    const audio = document.getElementById('bg-audio');
    audio.play().catch(err => console.log("Lecture bloquée :", err));
    // Retire l'écouteur après le premier clic
    this.removeEventListener('click', arguments.callee);
  });
</script>
  <p style="
    max-width: 90vw;
    margin: 2em auto;
    text-align: center;
    word-break: break-word;
    overflow-wrap: break-word;
    font-size: clamp(0.9rem, 2.5vw, 1.2rem);
  ">
bGliZXJ0w6ksIGTDqW1vY3JhdGllLCBwYXJ0YWdlLg==</p>
</body>
</html>
