    .videos-container {

      gap: 2em;
      padding: 2em;

      margin: 0 auto;
    }

      position: relative;

      height: 0;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);

    .video-frame iframe {
      position: absolute;

      height: 100%;
