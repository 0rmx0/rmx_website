<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anarchisme</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .videos-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2em;
      padding: 2em;
      max-width: 1200px;
      margin: 0 auto;
    }

    .video-frame {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    .video-frame video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      background: black;
    }
  </style>
</head>
<body>

  <div id="navigation"></div>
  <script src="js/nav.js"></script>

  <h1>Anarchisme</h1>

<div class="videos-container">

  <div class="video-frame">
    <video controls preload="none">
      <source src="video/Ni Dieu ni maître une histoire de l'anarchisme - Livre 1 - La Volupté de la destruction (1840-1914) version longue 1080p.mp4" type="video/mp4">
      Votre navigateur ne supporte pas la lecture vidéo.
    </video>
  </div>

  <div class="video-frame">
    <video controls preload="none">
      <source src="video/Ni Dieu ni maître une histoire de l'anarchisme - Livre 2 - La Mémoire des vaincus (1911-1945) version longue 1080p.mp4" type="video/mp4">
      Votre navigateur ne supporte pas la lecture vidéo.
    </video>
  </div>

  <div class="video-frame">
    <video controls preload="none">
      <source src="video/Ni Dieu ni maître une histoire de l'anarchisme - Livre 3 - Des fleurs et des pavés (1944-1969) 1080p.mp4" type="video/mp4">
      Votre navigateur ne supporte pas la lecture vidéo.
    </video>
  </div>

  <div class="video-frame">
    <video controls preload="none">
      <source src="video/Ni Dieu ni maître une histoire de l'anarchisme - Livre 4 - Les réseaux de la colère (1965-2012) 1080p.mp4" type="video/mp4">
      Votre navigateur ne supporte pas la lecture vidéo.
    </video>
  </div>

</div>
  <audio id="bg-audio" loop>
    <source src="audio/ANARCHISME.mp3" type="audio/mpeg" />
  </audio>

  
  <script>
    document.querySelector('h1').addEventListener('click', function () {
      const audio = document.getElementById('bg-audio');
      audio.play().catch(err => console.log("Lecture bloquée :", err));
      // Retire l'écouteur après le premier clic
      this.removeEventListener('click', arguments.callee);
    });
  </script>

  <p id="bottom-text">
TGEgcHJvcHJpw6l0w6ksIGMnZXN0IGxlIHZvbCAh</p>
</body>
</html>
